<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Administration</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/premium.css">
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg, #F4F6FA);padding:24px}
    .auth-card{background:#fff;border-radius:var(--radius-lg,20px);padding:40px;max-width:420px;width:100%;box-shadow:var(--shadow-lg,0 20px 60px rgba(0,0,0,.08));border:1px solid var(--border,#E8ECF1)}
    .auth-brand{text-align:center;margin-bottom:28px}
    .auth-brand img{width:180px;height:auto;object-fit:contain;margin:0 auto 16px;display:block}
    .auth-brand h1{font-size:1.2rem;font-weight:800;color:var(--text,#2C3E50)}
    .auth-brand p{font-size:.82rem;color:var(--text-secondary,#7F8C8D);margin-top:4px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:.78rem;font-weight:600;color:var(--text,#2C3E50);margin-bottom:6px}
    .form-control{width:100%;padding:12px 16px;border:1.5px solid var(--border,#E8ECF1);border-radius:var(--radius-md,12px);font-size:.9rem;outline:none;font-family:var(--font,'Plus Jakarta Sans',sans-serif);background:var(--bg,#F4F6FA);color:var(--text,#2C3E50)}
    .form-control:focus{border-color:var(--orange,#FF8E53);box-shadow:0 0 0 4px rgba(255,142,83,.1);background:#fff}
    .auth-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-md,12px);background:var(--orange,#FF8E53);color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font,'Plus Jakarta Sans',sans-serif);transition:all 300ms}
    .auth-btn:hover{box-shadow:0 8px 24px rgba(255,142,83,.3)}
    .auth-error{background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25);border-radius:var(--radius-md,12px);padding:10px 14px;margin-bottom:16px;font-size:.8rem;color:var(--red,#E74C3C)}
    .auth-foot{text-align:center;margin-top:18px;font-size:.78rem;color:var(--text-secondary,#7F8C8D)}
    .auth-foot a{color:var(--pink,#FF6B9D);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <img src="../img/image-Photoroom.png" alt="Cultulangues">
      <h1>Administration Cultulangues</h1>
      <p>Connectez-vous pour gérer vos réservations</p>
    </div>
    <div class="auth-error hidden" id="authError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Courriel</label>
        <input class="form-control" type="email" id="loginEmail" placeholder="admin@cultulangues.ca" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Mot de passe</label>
        <input class="form-control" type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button class="auth-btn" type="submit" id="loginBtn"><i class="fas fa-lock"></i> Se connecter</button>
    </form>
    <div class="auth-foot"><a href="../index.html">← Retour au site public</a></div>
  </div>

  <script>
    function showError(msg) {
      var el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';

      window.CultulanguesAPI.login(email, password).then(function (user) {
        var role = user && user.role ? user.role : null;
        if (role !== 'admin') {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-lock"></i> Se connecter';
          showError('Ce compte n\'a pas les droits d\'administration.');
          return;
        }
        window.location.href = 'dashboard.html';
      }).catch(function (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-lock"></i> Se connecter';
        showError((err && err.message) ? err.message : 'Connexion impossible. Vérifiez vos identifiants.');
      });
    });
  </script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
