<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enseignants — Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/premium.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="sidebar-header"><a href="../index.html" class="logo"><img src="../img/image-Photoroom.png" alt="Cultulangues" class="logo-img"></a></div>
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebarUserName">Admin</div><div class="sidebar-user-role">Administrateur</div></div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section" data-i18n="admin.sidebar.section.gestion">Gestion</div>
        <a class="sidebar-item" data-href="dashboard.html"><span class="sidebar-item-icon">📊</span><span data-i18n="admin.sidebar.overview">Vue d'ensemble</span></a>
        <a class="sidebar-item" data-href="programs.html"><span class="sidebar-item-icon">📚</span><span data-i18n="admin.sidebar.programs">Programmes</span></a>
        <a class="sidebar-item active" data-href="teachers.html"><span class="sidebar-item-icon">👩</span><span data-i18n="admin.sidebar.teachers">Enseignants</span></a>
        <a class="sidebar-item" data-href="students.html"><span class="sidebar-item-icon">👥</span><span data-i18n="admin.sidebar.students">Étudiants</span></a>
        <a class="sidebar-item" data-href="bookings.html"><span class="sidebar-item-icon">📅</span><span data-i18n="admin.sidebar.bookings">Réservations</span></a>
        <a class="sidebar-item" data-href="lessons.html"><span class="sidebar-item-icon">📘</span><span data-i18n="admin.sidebar.lessons">Leçons</span></a>
        <a class="sidebar-item" data-href="sessions.html"><span class="sidebar-item-icon">🗓</span><span data-i18n="admin.sidebar.sessions">Séances</span></a>
        <a class="sidebar-item" data-href="payments.html"><span class="sidebar-item-icon">💳</span><span data-i18n="admin.sidebar.payments">Paiements</span></a>
        <a class="sidebar-item" data-href="calendar.html"><span class="sidebar-item-icon">📅</span><span data-i18n="admin.sidebar.calendar">Calendrier</span></a>
        <a class="sidebar-item" data-href="analytics.html"><span class="sidebar-item-icon">📈</span><span data-i18n="admin.sidebar.analytics">Analytiques</span></a>
        <div class="sidebar-section" data-i18n="admin.sidebar.section.system">Système</div>
        <a class="sidebar-item" data-href="settings.html"><span class="sidebar-item-icon">⚙</span><span data-i18n="admin.sidebar.settings">Paramètres</span></a>
      </nav>
      <div class="sidebar-footer"><a class="sidebar-item" href="#" id="logoutLink"><span class="sidebar-item-icon">🚪</span><span data-i18n="admin.sidebar.logout">Déconnexion</span></a></div>
    </aside>
    <div class="mobile-nav-overlay sidebar-overlay"></div>
    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="topbar-left"><button class="sidebar-toggle">☰</button><h1 class="topbar-title" data-i18n="admin.teachers.title">Enseignants</h1></div>
        <div class="topbar-right">
          <div class="topbar-search"><span class="topbar-search-icon">🔍</span><input type="text" id="teacherSearch" data-i18n-placeholder="admin.common.search" placeholder="Rechercher..."></div>
          <button class="topbar-notification">🔔<span class="notification-dot"></span></button>
          <div class="avatar avatar-sm" id="topbarAvatar">A</div>
        </div>
      </header>
      <div class="dashboard-content">
        <div class="dashboard-content-header"><h2 data-i18n="admin.teachers.management">Gestion des enseignants</h2></div>
        <div class="card">
          <div class="table-container">
            <table class="table">
              <thead><tr><th data-i18n="admin.table.teacher">Professeur</th><th data-i18n="admin.table.email">Email</th><th data-i18n="admin.table.department">Département</th><th data-i18n="admin.table.specialties">Spécialité</th><th data-i18n="admin.table.rating">Évaluation</th><th data-i18n="admin.table.rate">Taux horaire</th></tr></thead>
              <tbody id="teachersBody">
                <tr><td colspan="6" class="text-muted text-center" style="padding: var(--space-lg) 0;">Chargement…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script>
    (function () {
      'use strict';

      var searchTimer = null;

      function requireAdmin() {
        if (!window.CultulanguesAPI || !CultulanguesAPI.getToken()) {
          window.location.href = 'login.html';
          return false;
        }
        var role = CultulanguesAPI.getRole();
        if (role === 'teacher') { window.location.href = '../teacher/dashboard.html'; return false; }
        if (role === 'student') { window.location.href = '../student/dashboard.html'; return false; }
        return true;
      }

      function setText(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function renderUser(user) {
        if (!user) return;
        var name = user.full_name || 'Admin';
        var initials = user.initials || (name.split(/\s+/).map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase() || 'A');
        setText('sidebarAvatar', initials);
        setText('sidebarUserName', name);
        setText('topbarAvatar', initials);
      }

      function formatMoney(n) {
        return Number(n || 0).toLocaleString('fr-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 });
      }

      function renderTeachers(teachers) {
        var body = document.getElementById('teachersBody');
        if (!teachers || !teachers.length) {
          body.innerHTML = '<tr><td colspan="6" class="text-muted text-center" style="padding: var(--space-lg) 0;">Aucun enseignant.</td></tr>';
          return;
        }
        body.innerHTML = teachers.map(function (t) {
          var name = t.full_name || ((t.first_name || '') + ' ' + (t.last_name || '')).trim() || '—';
          var initials = t.initials || (name.split(/\s+/).map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase() || '—');
          var profile = t.teacher_profile || {};
          return '<tr>' +
            '<td><div class="flex items-center gap-sm"><div class="avatar avatar-sm">' + escapeHtml(initials) + '</div><span>' + escapeHtml(name) + '</span></div></td>' +
            '<td>' + escapeHtml(t.email || '—') + '</td>' +
            '<td>' + escapeHtml(profile.department || '—') + '</td>' +
            '<td><span class="badge badge-emerald">' + escapeHtml(profile.specialization || profile.certifications || '—') + '</span></td>' +
            '<td>' + (profile.rating != null ? escapeHtml(profile.rating) + ' / 5' : '—') + '</td>' +
            '<td>' + escapeHtml(profile.hourly_rate != null ? formatMoney(profile.hourly_rate) + '/h' : '—') + '</td>' +
          '</tr>';
        }).join('');
      }

      function loadTeachers() {
        if (!requireAdmin()) return;
        var cached = CultulanguesAPI.getUser();
        if (cached) renderUser(cached);

        var params = { role: 'teacher', per_page: 100 };
        if (searchTimer) clearTimeout(searchTimer);
        CultulanguesAPI.get('/admin/users', params).then(function (resp) {
          renderTeachers(resp.data);
        }).catch(function (err) {
          var unauthorized = err && (err.status === 401 || (err.response && err.response.status === 401));
          document.getElementById('teachersBody').innerHTML = '<tr><td colspan="6" class="text-muted text-center" style="padding: var(--space-lg) 0;">Erreur : ' + escapeHtml((err && err.message) || 'Serveur indisponible') + '</td></tr>';
          if (unauthorized) window.location.href = 'login.html';
        });
      }

      function bindLogout() {
        var link = document.getElementById('logoutLink');
        if (!link) return;
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var goHome = function () { window.location.href = '../index.html'; };
          if (window.CultulanguesAPI) CultulanguesAPI.logout().then(goHome).catch(goHome);
          else goHome();
        });
      }

      document.getElementById('teacherSearch').addEventListener('input', function (e) {
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(loadTeachers, 400);
      });

      bindLogout();
      loadTeachers();
    })();
  </script>
  <script src="../js/main.js"></script>
</body>
</html>
