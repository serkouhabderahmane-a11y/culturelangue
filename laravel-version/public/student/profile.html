<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="student.profile.page_title">Profil — Cultulangues</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/premium.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="dashboard-body">
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="sidebar-header"><a href="../index.html" class="logo"><img src="../img/image-Photoroom.png" alt="Cultulangues" class="logo-img"></a></div>
      <div class="sidebar-user"><div class="avatar" id="sidebarAvatar">—</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebarUserName">Étudiant·e</div><div class="sidebar-user-role" id="sidebarUserRole">Étudiante</div></div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section" data-i18n="student.sidebar.navigation">Navigation</div>
        <a class="sidebar-item" data-href="dashboard.html"><span class="sidebar-item-icon">📊</span> <span data-i18n="student.sidebar.dashboard">Tableau de bord</span></a>
        <a class="sidebar-item" data-href="my-programs.html"><span class="sidebar-item-icon">📚</span> <span data-i18n="student.sidebar.my_programs">Mes programmes</span></a>
        <a class="sidebar-item" data-href="calendar.html"><span class="sidebar-item-icon">📅</span> <span data-i18n="student.sidebar.calendar">Mon calendrier</span></a>
        <a class="sidebar-item" data-href="payments.html"><span class="sidebar-item-icon">💳</span> <span data-i18n="student.sidebar.payments">Paiements & factures</span></a>
        <a class="sidebar-item" data-href="level-tests.html"><span class="sidebar-item-icon">📝</span> <span data-i18n="student.sidebar.level_tests">Tests de niveau</span></a>
        <div class="sidebar-section" data-i18n="student.sidebar.settings">Paramètres</div>
        <a class="sidebar-item active" data-href="profile.html"><span class="sidebar-item-icon">⚙</span> <span data-i18n="student.sidebar.profile">Profil</span></a>
        <a class="sidebar-item" data-href="support.html"><span class="sidebar-item-icon">🛠</span> <span data-i18n="student.sidebar.support">Support</span></a>
      </nav>
      <div class="sidebar-footer"><a class="sidebar-item" href="#" id="logoutLink"><span class="sidebar-item-icon">🚪</span> <span data-i18n="student.sidebar.logout">Déconnexion</span></a></div>
    </aside>
    <div class="mobile-nav-overlay sidebar-overlay"></div>
    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="topbar-left"><button class="sidebar-toggle">☰</button><h1 class="topbar-title" data-i18n="student.profile.title">Profil</h1></div>
        <div class="topbar-right"><div class="topbar-search"><span class="topbar-search-icon">🔍</span><input type="text" placeholder="Rechercher..." data-i18n-placeholder="student.common.search"></div><button class="topbar-notification">🔔<span class="notification-dot"></span></button><div class="avatar avatar-sm" id="topbarAvatar">—</div></div>
      </header>
      <div class="dashboard-content">
        <div class="card mb-lg">
          <div class="flex items-center" style="gap: var(--space-lg); flex-wrap: wrap;">
            <div class="avatar avatar-xl" id="profileAvatar">—</div>
            <div>
              <h2 id="profileName">Chargement…</h2>
              <p style="color: var(--color-text-secondary);" id="profileEmail">—</p>
              <span class="badge badge-blue" id="profileLevelBadge">—</span>
              <span class="badge" id="profileNumberBadge" style="display: none;"></span>
            </div>
          </div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><h3 class="card-title" data-i18n="student.profile.personal_info">Informations personnelles</h3></div>
            <div class="card-body">
              <form id="personalForm">
                <div class="form-row">
                  <div class="form-group"><label class="form-label" data-i18n="student.profile.first_name">Prénom</label><input type="text" class="form-input" id="inputFirstName" value=""></div>
                  <div class="form-group"><label class="form-label" data-i18n="student.profile.last_name">Nom</label><input type="text" class="form-input" id="inputLastName" value=""></div>
                </div>
                <div class="form-group"><label class="form-label" data-i18n="student.profile.email">Email</label><input type="email" class="form-input" id="inputEmail" value="" readonly></div>
                <div class="form-group"><label class="form-label" data-i18n="student.profile.phone">Téléphone</label><input type="tel" class="form-input" id="inputPhone" value=""></div>
                <button type="submit" class="btn btn-primary" data-i18n="student.profile.save">Enregistrer</button>
                <span id="personalSaveMsg" class="text-muted" style="margin-left: var(--space-sm); font-size: 0.8125rem;"></span>
              </form>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title" data-i18n="student.profile.language_prefs">Préférences linguistiques</h3></div>
            <div class="card-body">
              <form id="langForm">
                <div class="form-group"><label class="form-label" data-i18n="student.profile.current_level">Niveau actuel</label><input type="text" class="form-input" id="inputCurrentLevel" value=""></div>
                <div class="form-group"><label class="form-label" data-i18n="student.profile.target_level">Niveau visé</label><input type="text" class="form-input" id="inputTargetLevel" value=""></div>
                <div class="form-group"><label class="form-label" data-i18n="student.profile.native_language">Langue maternelle</label><input type="text" class="form-input" id="inputNativeLanguage" value=""></div>
                <div class="form-group"><label class="form-label" data-i18n="student.profile.objective">Objectif</label><input type="text" class="form-input" id="inputGoal" value=""></div>
                <button type="submit" class="btn btn-primary" data-i18n="student.profile.update">Mettre à jour</button>
                <span id="langSaveMsg" class="text-muted" style="margin-left: var(--space-sm); font-size: 0.8125rem;"></span>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script>
    (function () {
      'use strict';

      function requireStudent() {
        if (!window.CultulanguesAPI || !CultulanguesAPI.getToken()) {
          window.location.href = '../pages/login.html';
          return false;
        }
        var role = CultulanguesAPI.getRole();
        if (role === 'teacher') { window.location.href = '../teacher/dashboard.html'; return false; }
        if (role === 'admin') { window.location.href = '../admin/dashboard.html'; return false; }
        return true;
      }

      function setText(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }
      function setValue(id, value) { var el = document.getElementById(id); if (el) el.value = value == null ? '' : value; }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function initialsOf(name) {
        return (name || '—').split(/\s+/).map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase() || '—';
      }

      function applyUser(user) {
        if (!user) return;
        var profile = user.student_profile || {};
        var name = user.full_name || 'Étudiant·e';
        setText('sidebarAvatar', user.initials || initialsOf(name));
        setText('sidebarUserName', name);
        setText('sidebarUserRole', profile.current_level ? 'Étudiante à ' + profile.current_level : 'Étudiante');
        setText('topbarAvatar', user.initials || initialsOf(name));
        setText('profileAvatar', user.initials || initialsOf(name));
        setText('profileName', name);
        setText('profileEmail', user.email || '—');
        setText('profileLevelBadge', profile.current_level ? 'Niveau ' + profile.current_level : 'Niveau —');
        setText('profileNumberBadge', profile.student_number ? 'N° ' + profile.student_number : '');
        document.getElementById('profileNumberBadge').style.display = profile.student_number ? '' : 'none';
        setValue('inputFirstName', user.first_name);
        setValue('inputLastName', user.last_name);
        setValue('inputEmail', user.email);
        setValue('inputPhone', user.phone);
        setValue('inputCurrentLevel', profile.current_level);
        setValue('inputTargetLevel', profile.target_level);
        setValue('inputNativeLanguage', profile.native_language);
        setValue('inputGoal', profile.goal);
      }

      function loadProfile() {
        if (!requireStudent()) return;
        var cached = CultulanguesAPI.getUser();
        if (cached) applyUser(cached);
        CultulanguesAPI.get('/me').then(function (resp) {
          applyUser(resp.data.user);
        }).catch(function () { /* keep cached */ });
      }

      function bindForm(formId, msgId, payloadFn) {
        var form = document.getElementById(formId);
        if (!form) return;
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var msg = document.getElementById(msgId);
          if (!window.CultulanguesAPI) return;
          CultulanguesAPI.put('/me', payloadFn()).then(function () {
            msg.textContent = 'Enregistré ✓';
            setTimeout(function () { msg.textContent = ''; }, 3000);
            return CultulanguesAPI.get('/me').then(function (resp) { applyUser(resp.data.user); });
          }).catch(function (err) {
            msg.textContent = (err && err.message) || 'Erreur lors de l\'enregistrement';
          });
        });
      }

      function bindLogout() {
        var link = document.getElementById('logoutLink');
        if (!link) return;
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var goHome = function () { window.location.href = '../pages/login.html'; };
          if (window.CultulanguesAPI) CultulanguesAPI.logout().then(goHome).catch(goHome);
          else goHome();
        });
      }

      bindLogout();
      loadProfile();
      bindForm('personalForm', 'personalSaveMsg', function () {
        return {
          first_name: document.getElementById('inputFirstName').value,
          last_name: document.getElementById('inputLastName').value,
          phone: document.getElementById('inputPhone').value
        };
      });
      bindForm('langForm', 'langSaveMsg', function () {
        return {
          current_level: document.getElementById('inputCurrentLevel').value,
          target_level: document.getElementById('inputTargetLevel').value,
          native_language: document.getElementById('inputNativeLanguage').value,
          goal: document.getElementById('inputGoal').value
        };
      });
    })();
  </script>
  <script src="../js/main.js"></script>
</body>
</html>
